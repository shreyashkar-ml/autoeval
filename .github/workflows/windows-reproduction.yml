name: Windows reproduction

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install from autoexp.dev
        run: curl -fsSL https://autoexp.dev/install.sh | bash
      - name: Verify installed CLI
        run: |
          autoexp --version
          autoexp doctor
      - name: Run Python test suite on Windows
        run: |
          uv sync --extra test
          uv run pytest -q
      - name: Run OpenCode adapter tests
        working-directory: adapters/opencode-plugin
        run: npm test
      - name: Run Pi adapter tests
        working-directory: adapters/pi-extension
        run: npm test
