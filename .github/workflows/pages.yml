name: Deploy autoexp.dev

on:
  push:
    branches: [main]
    paths:
      - index.html
      - style.css
      - install.sh
      - CNAME
      - assets/agents/**
      - assets/autoexp_demo.png
      - assets/review_image.png
      - assets/autoresearch_demo.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site/assets/agents
          cp index.html style.css install.sh CNAME _site/
          cp assets/autoexp_demo.png assets/review_image.png assets/autoresearch_demo.png _site/assets/
          cp assets/agents/* _site/assets/agents/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
